# Typecheck, unit tests and production build on every push to main and every PR.
# `pnpm build` is the only check for the dot-server rule (a route whose client
# exports reach a `.server` module) — dev never surfaces it, so this is where
# it gets caught.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@12.4.1

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ratchet against .claude/tsc-baseline.json: fails when a file has more
      # errors than its baseline, or when the baseline still allows errors
      # that have since been fixed.
      - name: Typecheck
        run: node .claude/hooks/check-staged-types.mjs --all

      # Excluded:
      # - collection-actions and pin-actions write to a live Postgres, and CI
      #   has none.
      # - activity.test.ts has 4 failures (formatActivity) that predate CI.
      #   Remove it from this list once they're fixed.
      - name: Unit tests
        run: >-
          pnpm test
          --exclude app/.server/__tests__/collection-actions.test.ts
          --exclude app/utils/__tests__/pin-actions.test.ts
          --exclude app/utils/__tests__/activity.test.ts

      - name: Build
        run: pnpm build

  # The production image: builds, carries a working Prisma CLI for fly.toml's
  # release_command, and serves /api/health. No database — the check only
  # proves the server boots, so the env values are placeholders.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t stashly:ci .

      - name: Prisma CLI loads the schema
        run: docker run --rm stashly:ci node_modules/.bin/prisma validate

      - name: Server answers /api/health
        run: |
          docker run -d --name app -p 8080:8080 \
            -e DATABASE_URL=postgresql://ci:ci@127.0.0.1:5432/ci \
            -e BETTER_AUTH_SECRET=ci-placeholder-secret-0123456789abcdef \
            -e COOKIE_SECRET=ci-placeholder-cookie-0123456789abcdef \
            -e AWS_ACCESS_KEY=ci -e AWS_SECRET_KEY=ci -e AWS_REGION=auto \
            -e AWS_ENDPOINT_URL=http://127.0.0.1:9000 \
            -e STRIPE_SECRET_KEY=sk_test_ci_placeholder \
            stashly:ci
          for i in $(seq 1 30); do
            if curl -fsS -o /dev/null -w '%{http_code}\n' http://localhost:8080/api/health; then
              docker logs app
              exit 0
            fi
            sleep 2
          done
          docker logs app
          exit 1

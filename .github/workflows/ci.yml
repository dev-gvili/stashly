# Typecheck, every unit test against a real Postgres, the production build, and
# the production image migrated and booted against that Postgres — on every
# push to main and every PR. Nothing is excluded and nothing is muted: a
# failing test or a broken boot turns this red, and every log stays visible.
#
# `pnpm build` is the only check for the dot-server rule (a route whose client
# exports reach a `.server` module) — dev never surfaces it, so this is where
# it gets caught.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A push to main gets its own group (its sha), so parallel Cortex workers'
  # pushes never cancel each other; a PR's newer push still cancels its older run.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same major version and extensions as the dev database (Postgres 17,
    # pgvector 0.8, pg_trgm); the migrations create `vector` and `pg_trgm`.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: stashly
          POSTGRES_PASSWORD: stashly
          POSTGRES_DB: stashly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stashly -d stashly_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://stashly:stashly@localhost:5432/stashly_ci
      DIRECT_DATABASE_URL: postgresql://stashly:stashly@localhost:5432/stashly_ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@12.4.1

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ratchet against .claude/tsc-baseline.json: fails when a file has more
      # errors than its baseline, or when the baseline still allows errors
      # that have since been fixed.
      - name: Typecheck
        run: node .claude/hooks/check-staged-types.mjs --all

      # eslint.config.js: bans `as any` (tech-debt item 12). Needs no generated
      # files, so it runs before the database steps.
      - name: Lint
        run: pnpm lint

      - name: Apply migrations to the CI database
        run: pnpm prisma migrate deploy

      # Every test file, including the ones that need a database.
      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # The Playwright specs in tests/e2e, against the dev server and a real
  # Postgres, the way they run locally (tech-debt item 20). Uploads and
  # thumbnails need real object storage: the global setup creates a Tigris
  # bucket for the seeded user through `createUserBucket`, which calls Tigris's
  # own bucket-settings API, so an S3 stand-in can't take its place. The keys
  # come from the repository secrets AWS_ACCESS_KEY and AWS_SECRET_KEY; the
  # global teardown deletes the bucket again. Auth and Stripe are placeholders.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: stashly
          POSTGRES_PASSWORD: stashly
          POSTGRES_DB: stashly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stashly -d stashly_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://stashly:stashly@localhost:5432/stashly_ci
      DIRECT_DATABASE_URL: postgresql://stashly:stashly@localhost:5432/stashly_ci
      BETTER_AUTH_SECRET: ci-placeholder-secret-0123456789abcdef
      SESSION_SECRET: ci-placeholder-cookie-0123456789abcdef
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      AWS_ENDPOINT_URL: https://fly.storage.tigris.dev
      AWS_REGION: auto
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@12.4.1

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser download is cached by lockfile (Playwright's version is in
      # it); `install` still runs for the system packages and is a no-op for
      # a browser already in the cache.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations to the CI database
        run: pnpm prisma migrate deploy

      # The global setup signs users up on the free plan and stops without one.
      # Only that row: the full seed fills the database with mock users.
      - name: Seed the free storage plan
        run: >-
          psql "$DATABASE_URL" -c "INSERT INTO \"StoragePlan\"
          (id, name, tag, description, type, \"storageLimit\", \"workspaceLimit\", \"memberLimit\", features, \"priceCents\")
          VALUES ('splan_ci_free', 'Free - 15 GB', 'free', 'A lightweight plan for individual use',
          'free', 16106127360, 1, 1, ARRAY['15 GB storage'], 0)"

      # The specs and the session cookie expect http://localhost on port 80
      # (playwright.config.ts, auth.ts trustedOrigins); this lets the dev
      # server bind it without root.
      - name: Allow port 80
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80

      # The search-indexing downloads the tests would repeat in every browser
      # context (tests/e2e/model-cache.ts). Bump `v1` to drop a stale model.
      - uses: actions/cache@v6
        with:
          path: tests/e2e/.cache/net
          key: e2e-net-v1-all-mpnet-base-v2

      # playwright.config.ts starts the dev server and runs E2E_WORKERS workers
      # (default 1), each signed in as its own seeded user
      # (tests/e2e/constants.ts). One here: on this 2-vCPU runner, 2 workers made
      # every test 2-3x slower (hydration past 5 s) and failed 5 navigation tests
      # (run 43349413318, 7.3 min against 5.4-8.6 min on one worker).
      - name: E2E tests
        run: pnpm test:e2e --reporter=list,html

      # Always, pass or fail: the HTML report and the traces of failed tests.
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  # The production image, run the way Fly runs it: fly.toml's release_command
  # (`prisma migrate deploy`) against a real Postgres, then the server, which
  # must answer /api/health 200 — and that check queries the database. A second
  # container pointed at a database that isn't there must answer 503, which
  # proves the health check can fail at all.
  #
  # Third-party secrets (auth, OAuth, Stripe, S3) are placeholders: this job
  # proves the image migrates, boots and reaches its database, not that those
  # integrations work. Their warnings in the server log are expected and left
  # visible.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: stashly
          POSTGRES_PASSWORD: stashly
          POSTGRES_DB: stashly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stashly -d stashly_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DB_URL: postgresql://stashly:stashly@localhost:5432/stashly_ci
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t stashly:ci .

      - name: Prisma CLI loads the schema
        run: docker run --rm stashly:ci node_modules/.bin/prisma validate

      # --network host: the container reaches the Postgres service on localhost.
      - name: Release command migrates the database
        run: >-
          docker run --rm --network host
          -e DIRECT_DATABASE_URL="$DB_URL"
          stashly:ci node_modules/.bin/prisma migrate deploy

      - name: Server reaches its database (/api/health must be 200)
        run: |
          docker run -d --name app --network host \
            -e PORT=8080 \
            -e DATABASE_URL="$DB_URL" -e DIRECT_DATABASE_URL="$DB_URL" \
            -e BETTER_AUTH_SECRET=ci-placeholder-secret-0123456789abcdef \
            -e SESSION_SECRET=ci-placeholder-cookie-0123456789abcdef \
            -e AWS_ACCESS_KEY=ci -e AWS_SECRET_KEY=ci -e AWS_REGION=auto \
            -e AWS_ENDPOINT_URL=http://127.0.0.1:9000 \
            -e STRIPE_SECRET_KEY=sk_test_ci_placeholder \
            stashly:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o body.json -w '%{http_code}' http://localhost:8080/api/health || true)
            echo "attempt $i: HTTP $code $(cat body.json 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          exit 1

      - name: Health check fails without a database (/api/health must be 503)
        run: |
          docker run -d --name app-nodb --network host \
            -e PORT=8081 \
            -e DATABASE_URL=postgresql://stashly:stashly@localhost:5999/missing \
            -e BETTER_AUTH_SECRET=ci-placeholder-secret-0123456789abcdef \
            -e SESSION_SECRET=ci-placeholder-cookie-0123456789abcdef \
            -e AWS_ACCESS_KEY=ci -e AWS_SECRET_KEY=ci -e AWS_REGION=auto \
            -e AWS_ENDPOINT_URL=http://127.0.0.1:9000 \
            -e STRIPE_SECRET_KEY=sk_test_ci_placeholder \
            stashly:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o body.json -w '%{http_code}' http://localhost:8081/api/health || true)
            echo "attempt $i: HTTP $code $(cat body.json 2>/dev/null)"
            [ "$code" = "503" ] && exit 0
            [ "$code" = "200" ] && { echo "health check passed with no database"; exit 1; }
            sleep 2
          done
          exit 1

      # Always, pass or fail: everything the servers printed.
      - name: Server logs
        if: always()
        run: |
          echo "===== app (real database) ====="; docker logs app 2>&1 || true
          echo "===== app-nodb (no database) ====="; docker logs app-nodb 2>&1 || true

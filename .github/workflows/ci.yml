# Typecheck, unit tests and production build on every push to main and every PR.
# `pnpm build` is the only check for the dot-server rule (a route whose client
# exports reach a `.server` module) — dev never surfaces it, so this is where
# it gets caught.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@12.4.1

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v4
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ratchet against .claude/tsc-baseline.json: fails only when a file has
      # more errors than its baseline, since the repo carries ~200 old ones.
      - name: Typecheck
        run: node .claude/hooks/check-staged-types.mjs --all

      # Excluded:
      # - collection-actions and pin-actions write to a live Postgres, and CI
      #   has none.
      # - activity.test.ts has 4 failures (formatActivity) that predate CI.
      #   Remove it from this list once they're fixed.
      - name: Unit tests
        run: >-
          pnpm test
          --exclude app/.server/__tests__/collection-actions.test.ts
          --exclude app/utils/__tests__/pin-actions.test.ts
          --exclude app/utils/__tests__/activity.test.ts

      - name: Build
        run: pnpm build

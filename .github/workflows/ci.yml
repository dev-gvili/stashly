# Typecheck, every unit test against a real Postgres, the production build, and
# the production image migrated and booted against that Postgres — on every
# push to main and every PR. Nothing is excluded and nothing is muted: a
# failing test or a broken boot turns this red, and every log stays visible.
#
# `pnpm build` is the only check for the dot-server rule (a route whose client
# exports reach a `.server` module) — dev never surfaces it, so this is where
# it gets caught.
name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  # A push to main gets its own group (its sha), so parallel Cortex workers'
  # pushes never cancel each other; a PR's newer push still cancels its older run.
  group: ci-${{ github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Same major version and extensions as the dev database (Postgres 17,
    # pgvector 0.8, pg_trgm); the migrations create `vector` and `pg_trgm`.
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: stashly
          POSTGRES_PASSWORD: stashly
          POSTGRES_DB: stashly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stashly -d stashly_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://stashly:stashly@localhost:5432/stashly_ci
      DIRECT_DATABASE_URL: postgresql://stashly:stashly@localhost:5432/stashly_ci
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@12.4.1

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # Ratchet against .claude/tsc-baseline.json: fails when a file has more
      # errors than its baseline, or when the baseline still allows errors
      # that have since been fixed.
      - name: Typecheck
        run: node .claude/hooks/check-staged-types.mjs --all

      # eslint.config.js: bans `as any` (tech-debt item 12). Needs no generated
      # files, so it runs before the database steps.
      - name: Lint
        run: pnpm lint

      - name: Apply migrations to the CI database
        run: pnpm prisma migrate deploy

      # Every test file, including the ones that need a database.
      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

  # The Playwright specs in tests/e2e, against the dev server and a real
  # Postgres, the way they run locally (tech-debt item 20). Uploads and
  # thumbnails need real object storage: the global setup creates a Tigris
  # bucket for the seeded user through `createUserBucket`, which calls Tigris's
  # own bucket-settings API, so an S3 stand-in can't take its place. The keys
  # come from the repository secrets AWS_ACCESS_KEY and AWS_SECRET_KEY; the
  # global teardown deletes the bucket again. Auth and Stripe are placeholders.
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: stashly
          POSTGRES_PASSWORD: stashly
          POSTGRES_DB: stashly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stashly -d stashly_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DATABASE_URL: postgresql://stashly:stashly@localhost:5432/stashly_ci
      DIRECT_DATABASE_URL: postgresql://stashly:stashly@localhost:5432/stashly_ci
      BETTER_AUTH_SECRET: ci-placeholder-secret-0123456789abcdef
      SESSION_SECRET: ci-placeholder-cookie-0123456789abcdef
      STRIPE_SECRET_KEY: sk_test_ci_placeholder
      AWS_ENDPOINT_URL: https://fly.storage.tigris.dev
      AWS_REGION: auto
      AWS_ACCESS_KEY: ${{ secrets.AWS_ACCESS_KEY }}
      AWS_SECRET_KEY: ${{ secrets.AWS_SECRET_KEY }}
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Install pnpm
        run: npm install -g pnpm@12.4.1

      - name: Locate the pnpm store
        id: pnpm-store
        run: echo "path=$(pnpm store path --silent)" >> "$GITHUB_OUTPUT"

      - uses: actions/cache@v6
        with:
          path: ${{ steps.pnpm-store.outputs.path }}
          key: pnpm-store-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: pnpm-store-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # The browser download is cached by lockfile (Playwright's version is in
      # it); `install` still runs for the system packages and is a no-op for
      # a browser already in the cache.
      - uses: actions/cache@v6
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}

      - name: Install Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Apply migrations to the CI database
        run: pnpm prisma migrate deploy

      # The global setup signs users up on the free plan and stops without one.
      # Only that row: the full seed fills the database with mock users.
      - name: Seed the free storage plan
        run: >-
          psql "$DATABASE_URL" -c "INSERT INTO \"StoragePlan\"
          (id, name, tag, description, type, \"storageLimit\", \"workspaceLimit\", \"memberLimit\", features, \"priceCents\")
          VALUES ('splan_ci_free', 'Free - 15 GB', 'free', 'A lightweight plan for individual use',
          'free', 16106127360, 1, 1, ARRAY['15 GB storage'], 0)"

      # The specs and the session cookie expect http://localhost on port 80
      # (playwright.config.ts, auth.ts trustedOrigins); this lets the dev
      # server bind it without root.
      - name: Allow port 80
        run: sudo sysctl -w net.ipv4.ip_unprivileged_port_start=80

      # Logged so a result can be read against the runner it ran on.
      - name: Runner size
        run: echo "nproc=$(nproc)"; free -m | head -2

      # CI tests the production build, not the dev server: a page load is 64
      # requests and 0.6 MB instead of 287 and 26.5 MB, and the e2e step took
      # 1.8 min (twice) against 2.7 and 3.4 on the dev server, build included
      # in the comparison at 18-23 s. Local runs keep the dev server.
      - name: Build the production server
        run: pnpm build

      # playwright.config.ts starts the server (`pnpm start` when CI is set) and
      # runs E2E_WORKERS workers (default 1), each signed in as its own seeded
      # user (tests/e2e/constants.ts). On the private repo's 2-vCPU runner, 2
      # workers made every test 2-3x slower and failed 5 navigation tests (run
      # 43349413318); the public repo's runner has 4 vCPUs.
      - name: E2E tests
        env:
          E2E_WORKERS: 2
          # The json reporter feeds the pass/fail counts in the job summary.
          PLAYWRIGHT_JSON_OUTPUT_FILE: e2e-results.json
        run: pnpm test:e2e --reporter=list,html,json

      # Always, pass or fail: the HTML report and the traces of failed tests.
      - name: Upload the Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

      - name: Summarise the e2e result
        if: always()
        run: |
          if [ -f e2e-results.json ]; then
            jq -r '.stats | "**E2E:** \(.expected) passed, \(.unexpected) failed, \(.flaky) flaky, \(.skipped) skipped in \((.duration/1000)|floor) s"' \
              e2e-results.json >> "$GITHUB_STEP_SUMMARY"
          else
            echo "**E2E:** no results file (the run stopped before the report)" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Trial (tech-debt task, 14 Nov): two ways to open the e2e report from the
  # run summary; the owner keeps one. A job of its own, so the write token and
  # the report-bucket key never reach the job that runs the tests' code. Pushes
  # to main only (a fork's PR has neither); both keep 14 days, like the artifact.
  e2e-report:
    needs: e2e
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    env:
      AWS_ENDPOINT_URL: https://fly.storage.tigris.dev
    steps:
      # Missing when the e2e job stopped before its upload step.
      - uses: actions/download-artifact@v4
        continue-on-error: true
        with:
          name: playwright-report

      #
      # Option 1, GitHub Pages: the report goes to the gh-pages branch under
      # e2e/<run_id>/. Each publish is a single orphan commit holding the runs
      # of the last 14 days, so the branch never grows; a race with another
      # run's publish loses the lease and retries. Public, like the repo: the
      # report holds seeded data only (checked in run 43582952953's traces).
      - name: Publish the report to GitHub Pages
        id: pages
        if: always() && github.event_name == 'push' && hashFiles('playwright-report/index.html') != ''
        env:
          RUN_ID: ${{ github.run_id }}
          REPO: ${{ github.repository }}
          TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          start=$(date +%s)
          remote="https://x-access-token:${TOKEN}@github.com/${REPO}.git"
          for attempt in 1 2 3 4 5; do
            rm -rf site && mkdir site && cd site
            git init -q && git config user.name ci && git config user.email ci@users.noreply.github.com
            lease=""
            if git fetch -q --depth 1 "$remote" gh-pages 2>/dev/null; then
              lease=$(git rev-parse FETCH_HEAD)
              git checkout -q FETCH_HEAD -- .
            fi
            now=$(date +%s)
            for dir in e2e/*/; do
              [ -f "$dir.published" ] || continue
              if [ $((now - $(cat "$dir.published"))) -gt $((14 * 86400)) ]; then rm -rf "$dir"; fi
            done
            rm -rf "e2e/$RUN_ID" && mkdir -p "e2e/$RUN_ID"
            cp -r ../playwright-report/. "e2e/$RUN_ID/"
            echo "$now" > "e2e/$RUN_ID/.published"
            touch .nojekyll
            git add -A && git commit -q -m "e2e report for run $RUN_ID"
            if git push -q --force-with-lease="gh-pages:${lease}" "$remote" HEAD:refs/heads/gh-pages; then
              cd ..
              echo "url=https://${REPO%%/*}.github.io/${REPO#*/}/e2e/${RUN_ID}/" >> "$GITHUB_OUTPUT"
              echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            cd .. && sleep $((attempt * 3))
          done
          exit 1

      # Option 2, the private Tigris bucket stashly-e2e-reports: the report goes
      # under <run_id>/ and the summary links a presigned index.html (7 days,
      # SigV4's maximum). Needs a key scoped to that bucket in the secrets
      # E2E_REPORTS_ACCESS_KEY / E2E_REPORTS_SECRET_KEY; skipped until it exists.
      - name: Publish the report to Tigris
        id: tigris
        if: always() && github.event_name == 'push' && hashFiles('playwright-report/index.html') != ''
        env:
          RUN_ID: ${{ github.run_id }}
          BUCKET: stashly-e2e-reports
          AWS_ACCESS_KEY_ID: ${{ secrets.E2E_REPORTS_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.E2E_REPORTS_SECRET_KEY }}
          AWS_DEFAULT_REGION: auto
        run: |
          set -euo pipefail
          if [ -z "$AWS_ACCESS_KEY_ID" ]; then
            echo "No E2E_REPORTS_ACCESS_KEY secret yet; skipping."
            exit 0
          fi
          start=$(date +%s)
          s3() { aws --endpoint-url "$AWS_ENDPOINT_URL" "$@"; }
          s3 s3 cp --recursive --only-show-errors playwright-report/ "s3://$BUCKET/$RUN_ID/"
          url=$(s3 s3 presign "s3://$BUCKET/$RUN_ID/index.html" --expires-in 604800)
          echo "url=$url" >> "$GITHUB_OUTPUT"
          echo "seconds=$(( $(date +%s) - start ))" >> "$GITHUB_OUTPUT"
          cutoff=$(date -u -d '14 days ago' +%Y-%m-%dT%H:%M:%S)
          s3 s3api list-objects-v2 --bucket "$BUCKET" \
            --query "Contents[?LastModified<'$cutoff'].Key" --output text |
            tr '\t' '\n' | grep -v '^None$' | while read -r key; do
              [ -n "$key" ] && s3 s3 rm --only-show-errors "s3://$BUCKET/$key"
            done || true

      - name: Link the published report
        if: always() && github.event_name == 'push'
        env:
          PAGES_URL: ${{ steps.pages.outputs.url }}
          PAGES_SECONDS: ${{ steps.pages.outputs.seconds }}
          TIGRIS_URL: ${{ steps.tigris.outputs.url }}
          TIGRIS_SECONDS: ${{ steps.tigris.outputs.seconds }}
        run: |
          {
            echo ""
            echo "**Report:**"
            if [ -n "$PAGES_URL" ]; then
              echo "- [GitHub Pages]($PAGES_URL) (published in ${PAGES_SECONDS} s; 404 until Pages is enabled on gh-pages)"
            else
              echo "- GitHub Pages: not published"
            fi
            if [ -n "$TIGRIS_URL" ]; then
              echo "- [Tigris, presigned for 7 days]($TIGRIS_URL) (published in ${TIGRIS_SECONDS} s)"
            else
              echo "- Tigris: not published (no E2E_REPORTS_ACCESS_KEY secret yet)"
            fi
            echo "- Fallback: the \`playwright-report\` artifact below"
          } >> "$GITHUB_STEP_SUMMARY"

  # The production image, run the way Fly runs it: fly.toml's release_command
  # (`prisma migrate deploy`) against a real Postgres, then the server, which
  # must answer /api/health 200 — and that check queries the database. A second
  # container pointed at a database that isn't there must answer 503, which
  # proves the health check can fail at all.
  #
  # Third-party secrets (auth, OAuth, Stripe, S3) are placeholders: this job
  # proves the image migrates, boots and reaches its database, not that those
  # integrations work. Their warnings in the server log are expected and left
  # visible.
  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    services:
      postgres:
        image: pgvector/pgvector:pg17
        env:
          POSTGRES_USER: stashly
          POSTGRES_PASSWORD: stashly
          POSTGRES_DB: stashly_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U stashly -d stashly_ci"
          --health-interval 2s
          --health-timeout 5s
          --health-retries 30
    env:
      DB_URL: postgresql://stashly:stashly@localhost:5432/stashly_ci
    steps:
      - uses: actions/checkout@v7

      - name: Build image
        run: docker build -t stashly:ci .

      - name: Prisma CLI loads the schema
        run: docker run --rm stashly:ci node_modules/.bin/prisma validate

      # --network host: the container reaches the Postgres service on localhost.
      - name: Release command migrates the database
        run: >-
          docker run --rm --network host
          -e DIRECT_DATABASE_URL="$DB_URL"
          stashly:ci node_modules/.bin/prisma migrate deploy

      - name: Server reaches its database (/api/health must be 200)
        run: |
          docker run -d --name app --network host \
            -e PORT=8080 \
            -e DATABASE_URL="$DB_URL" -e DIRECT_DATABASE_URL="$DB_URL" \
            -e BETTER_AUTH_SECRET=ci-placeholder-secret-0123456789abcdef \
            -e SESSION_SECRET=ci-placeholder-cookie-0123456789abcdef \
            -e AWS_ACCESS_KEY=ci -e AWS_SECRET_KEY=ci -e AWS_REGION=auto \
            -e AWS_ENDPOINT_URL=http://127.0.0.1:9000 \
            -e STRIPE_SECRET_KEY=sk_test_ci_placeholder \
            stashly:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o body.json -w '%{http_code}' http://localhost:8080/api/health || true)
            echo "attempt $i: HTTP $code $(cat body.json 2>/dev/null)"
            [ "$code" = "200" ] && exit 0
            sleep 2
          done
          exit 1

      - name: Health check fails without a database (/api/health must be 503)
        run: |
          docker run -d --name app-nodb --network host \
            -e PORT=8081 \
            -e DATABASE_URL=postgresql://stashly:stashly@localhost:5999/missing \
            -e BETTER_AUTH_SECRET=ci-placeholder-secret-0123456789abcdef \
            -e SESSION_SECRET=ci-placeholder-cookie-0123456789abcdef \
            -e AWS_ACCESS_KEY=ci -e AWS_SECRET_KEY=ci -e AWS_REGION=auto \
            -e AWS_ENDPOINT_URL=http://127.0.0.1:9000 \
            -e STRIPE_SECRET_KEY=sk_test_ci_placeholder \
            stashly:ci
          for i in $(seq 1 30); do
            code=$(curl -s -o body.json -w '%{http_code}' http://localhost:8081/api/health || true)
            echo "attempt $i: HTTP $code $(cat body.json 2>/dev/null)"
            [ "$code" = "503" ] && exit 0
            [ "$code" = "200" ] && { echo "health check passed with no database"; exit 1; }
            sleep 2
          done
          exit 1

      # Always, pass or fail: everything the servers printed.
      - name: Server logs
        if: always()
        run: |
          echo "===== app (real database) ====="; docker logs app 2>&1 || true
          echo "===== app-nodb (no database) ====="; docker logs app-nodb 2>&1 || true

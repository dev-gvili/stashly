<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&family=IBM+Plex+Sans:wght@400;500;600&display=swap">
<style>
:root{
  --bg:#f6f6f8; --surface:#ffffff; --sunk:#eeeef3; --line:#dcdce4;
  --ink:#16161c; --muted:#5d5d6b; --accent:#5b5bd6;
  --crit:#c4312b; --crit-bg:#fbe9e8; --mod:#a86400; --mod-bg:#fcf1de; --minor:#2f7a4a; --minor-bg:#e5f3ea;
  --mono:"IBM Plex Mono",ui-monospace,Menlo,Consolas,monospace;
  --sans:"IBM Plex Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#0e0e12; --surface:#17171d; --sunk:#1f1f27; --line:#2c2c36;
    --ink:#ececf2; --muted:#a2a2b0; --accent:#9d9cf5;
    --crit:#ff7b72; --crit-bg:#3a1a19; --mod:#f0b35a; --mod-bg:#35270f; --minor:#6fcf97; --minor-bg:#14301f;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#0e0e12; --surface:#17171d; --sunk:#1f1f27; --line:#2c2c36;
  --ink:#ececf2; --muted:#a2a2b0; --accent:#9d9cf5;
  --crit:#ff7b72; --crit-bg:#3a1a19; --mod:#f0b35a; --mod-bg:#35270f; --minor:#6fcf97; --minor-bg:#14301f;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font:15px/1.6 var(--sans);padding-inline:20px;padding-block:40px 72px}
.wrap{max-width:920px;margin:0 auto;display:flex;flex-direction:column;gap:44px}
header{display:flex;flex-direction:column;gap:10px}
.eyebrow{font:500 12px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
h1{font:600 clamp(28px,5vw,40px)/1.1 var(--mono);letter-spacing:-.02em;margin:0;text-wrap:balance}
h2{font:600 20px/1.2 var(--mono);margin:0 0 14px;text-wrap:balance}
p{margin:0;max-width:68ch}
.lede{font-size:17px;color:var(--ink)}
.meta{display:flex;flex-wrap:wrap;gap:8px;margin-top:6px}
.chip{font:500 12px/1 var(--mono);padding:7px 10px;border:1px solid var(--line);border-radius:6px;background:var(--surface);color:var(--muted);font-variant-numeric:tabular-nums}
.summary{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;display:flex;flex-direction:column;gap:4px}
.stat b{font:600 26px/1 var(--mono);font-variant-numeric:tabular-nums}
.stat span{font-size:13px;color:var(--muted)}
.stat.c b{color:var(--crit)} .stat.m b{color:var(--mod)} .stat.g b{color:var(--minor)}
.tbl{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
table{border-collapse:collapse;width:100%;min-width:620px}
th,td{text-align:left;vertical-align:top;padding:12px 14px;border-bottom:1px solid var(--line)}
tr:last-child td{border-bottom:0}
th{font:500 11px/1 var(--mono);letter-spacing:.08em;text-transform:uppercase;color:var(--muted);background:var(--sunk)}
td:first-child{width:38%}
td strong{display:block;font-weight:600;margin-bottom:2px}
td small{color:var(--muted);font-size:13px}
.sev{display:inline-block;font:600 11px/1 var(--mono);letter-spacing:.06em;text-transform:uppercase;padding:5px 8px;border-radius:4px;white-space:nowrap}
.sev.c{color:var(--crit);background:var(--crit-bg)} .sev.m{color:var(--mod);background:var(--mod-bg)} .sev.g{color:var(--minor);background:var(--minor-bg)}
code{font:13px var(--mono);background:var(--sunk);padding:1px 5px;border-radius:4px}
ul.clean{margin:0;padding:0;list-style:none;display:flex;flex-direction:column;gap:12px}
ul.clean li{display:grid;grid-template-columns:150px 1fr;gap:14px;padding-bottom:12px;border-bottom:1px dashed var(--line)}
ul.clean li:last-child{border-bottom:0;padding-bottom:0}
.k{font:500 12px/1.5 var(--mono);letter-spacing:.04em;text-transform:uppercase;color:var(--muted);padding-top:2px}
.works{display:grid;grid-template-columns:repeat(auto-fit,minmax(250px,1fr));gap:12px}
.works div{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 16px;font-size:14px}
.works b{display:block;font-family:var(--mono);font-size:13px;margin-bottom:4px;color:var(--minor)}
ol.prio{margin:0;padding:0;list-style:none;counter-reset:p;display:flex;flex-direction:column;gap:14px}
ol.prio li{counter-increment:p;display:grid;grid-template-columns:44px 1fr;gap:12px;background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:16px}
ol.prio li::before{content:counter(p);font:600 22px/1 var(--mono);color:var(--accent);padding-top:2px}
ol.prio strong{display:block;margin-bottom:4px}
.note{font-size:13px;color:var(--muted);border-top:1px solid var(--line);padding-top:16px}
@media (max-width:560px){ul.clean li{grid-template-columns:1fr;gap:4px}}

.doc{max-width:960px;margin:0 auto}
.doc h2{margin:44px 0 14px;padding-top:8px;border-top:1px solid var(--line)}
.doc h3{font:600 16px/1.3 var(--mono);margin:30px 0 8px;text-wrap:balance}
.doc p,.doc li{max-width:78ch}
.doc p{margin:0 0 12px}
.doc ul,.doc ol{margin:0 0 14px;padding-left:20px;display:flex;flex-direction:column;gap:6px}
.doc li ul{margin-top:6px}
.doc em{color:var(--muted)}
.doc hr{border:0;border-top:1px solid var(--line);margin:36px 0 16px}
.doc .tbl{margin:12px 0 20px}
.doc .tbl table{min-width:640px}
.doc .tbl td:first-child{width:auto}
.doc th,.doc td{font-size:13.5px;padding:10px 12px}
.doc td{font-variant-numeric:tabular-nums}
.doc tr.done td{color:var(--muted)}
.doc del{text-decoration-color:var(--muted)}
.pill{display:inline-block;font:600 10.5px/1 var(--mono);letter-spacing:.04em;text-transform:uppercase;padding:5px 7px;border-radius:4px;white-space:nowrap}
.pill.g{color:var(--minor);background:var(--minor-bg)} .pill.c{color:var(--crit);background:var(--crit-bg)}
.pill.m{color:var(--mod);background:var(--mod-bg)} .pill.o{color:var(--ink);background:var(--sunk)} .pill.x{color:var(--muted);background:var(--sunk)}
.doc a{color:var(--accent)}
.doc header{margin-bottom:8px}
</style>

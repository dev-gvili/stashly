  - tailwind-merge@3.7.0
  - xstate@5.33.0
  - zod@4.6.4
  - '@aws-sdk/client-s3@3.1140.0'
  - '@aws-sdk/lib-storage@3.1140.0'
  - '@aws-sdk/s3-request-presigner@3.1140.0'
  - '@better-auth/core@1.7.6'
  - '@better-auth/drizzle-adapter@1.7.6'
  - '@better-auth/kysely-adapter@1.7.6'
  - '@better-auth/memory-adapter@1.7.6'
  - '@better-auth/mongo-adapter@1.7.6'
  - '@better-auth/prisma-adapter@1.7.6'
  - '@better-auth/telemetry@1.7.6'
  - better-auth@1.7.6
  - framer-motion@13.4.3
  - vite@8.3.1
onlyBuiltDependencies:
  - '@prisma/engines'
  - esbuild
  - msw
  - onnxruntime-node
  - prisma
  - protobufjs
  - sharp
  - webgpu
